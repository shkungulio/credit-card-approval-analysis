<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="IBM Plex Serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .serif { font-family: "IBM Plex Serif", Georgia, serif; }
      .mono  { font-family: "IBM Plex Mono", "DejaVu Sans Mono", monospace; }
      .sans  { font-family: "IBM Plex Sans", Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1280" height="640" fill="#0F1712"/>

  <!-- greenbar stripes -->
  <g fill="#1B2A20" opacity="0.85">
    <rect x="44" y="48"  width="1192" height="48"/>
    <rect x="44" y="144" width="1192" height="48"/>
    <rect x="44" y="240" width="1192" height="48"/>
    <rect x="44" y="336" width="1192" height="48"/>
    <rect x="44" y="432" width="1192" height="48"/>
    <rect x="44" y="528" width="1192" height="48"/>
  </g>

  <!-- tractor-feed strips -->
  <g>
    <rect x="0" y="0" width="44" height="640" fill="#0A110D"/>
    <rect x="1236" y="0" width="44" height="640" fill="#0A110D"/>
    <line x1="44" y1="0" x2="44" y2="640" stroke="#3A4A3E" stroke-width="1" stroke-dasharray="3 5"/>
    <line x1="1236" y1="0" x2="1236" y2="640" stroke="#3A4A3E" stroke-width="1" stroke-dasharray="3 5"/>
    <g fill="#0F1712" stroke="#46584A" stroke-width="1">
      <circle cx="22" cy="28" r="6"/><circle cx="22" cy="76" r="6"/><circle cx="22" cy="124" r="6"/>
      <circle cx="22" cy="172" r="6"/><circle cx="22" cy="220" r="6"/><circle cx="22" cy="268" r="6"/>
      <circle cx="22" cy="316" r="6"/><circle cx="22" cy="364" r="6"/><circle cx="22" cy="412" r="6"/>
      <circle cx="22" cy="460" r="6"/><circle cx="22" cy="508" r="6"/><circle cx="22" cy="556" r="6"/>
      <circle cx="22" cy="604" r="6"/>
      <circle cx="1258" cy="28" r="6"/><circle cx="1258" cy="76" r="6"/><circle cx="1258" cy="124" r="6"/>
      <circle cx="1258" cy="172" r="6"/><circle cx="1258" cy="220" r="6"/><circle cx="1258" cy="268" r="6"/>
      <circle cx="1258" cy="316" r="6"/><circle cx="1258" cy="364" r="6"/><circle cx="1258" cy="412" r="6"/>
      <circle cx="1258" cy="460" r="6"/><circle cx="1258" cy="508" r="6"/><circle cx="1258" cy="556" r="6"/>
      <circle cx="1258" cy="604" r="6"/>
    </g>
  </g>

  <!-- ledger header -->
  <text class="mono" x="92" y="74" font-size="14" fill="#8EA391" letter-spacing="0.6">credit-card-approval-analysis</text>
  <text class="mono" x="1188" y="74" font-size="14" fill="#8EA391" text-anchor="end" letter-spacing="0.6">n = 1,319 applications</text>
  <line x1="92" y1="90" x2="1188" y2="90" stroke="#E9E7DA" stroke-width="2"/>

  <!-- headline -->
  <text class="serif" x="92" y="196" font-size="62" font-weight="700" fill="#F2F0E4">Credit card approval</text>
  <text class="serif" x="92" y="262" font-size="62" font-weight="700" fill="#F2F0E4">&amp; spending behavior</text>

  <!-- deck -->
  <text class="serif" x="92" y="322" font-size="21" fill="#B9C7BA">Two of the twelve features were recorded after the decision was made.</text>
  <text class="serif" x="92" y="352" font-size="21" fill="#B9C7BA">Removing them drops ROC-AUC from 0.988 to 0.853, and makes the model real.</text>

  <!-- stamp -->
  <g transform="rotate(-6 1000 214)">
    <rect x="856" y="140" width="290" height="148" fill="none" stroke="#F0625F" stroke-width="4" rx="3" opacity="0.92"/>
    <rect x="864" y="148" width="274" height="132" fill="none" stroke="#F0625F" stroke-width="1.5" rx="2" opacity="0.92"/>
    <text class="sans" x="1001" y="186" font-size="23" font-weight="600" fill="#F0625F" text-anchor="middle" letter-spacing="3.5">TARGET LEAKAGE</text>
    <line x1="896" y1="200" x2="1106" y2="200" stroke="#F0625F" stroke-width="1.5" opacity="0.92"/>
    <text class="mono" x="1001" y="234" font-size="30" font-weight="600" fill="#F0625F" text-anchor="middle">0.988</text>
    <line x1="938" y1="225" x2="1064" y2="225" stroke="#F0625F" stroke-width="3"/>
    <text class="sans" x="1001" y="264" font-size="15" font-weight="600" fill="#F0625F" text-anchor="middle" letter-spacing="1.6">share + expenditure</text>
  </g>

  <!-- chart -->
  <text class="serif" x="92" y="424" font-size="19" font-weight="600" fill="#F2F0E4">Approval rate (%) by number of derogatory reports</text>
  <line x1="92" y1="556" x2="602" y2="556" stroke="#8EA391" stroke-width="1.5"/>

  <g class="mono" font-size="15" font-weight="600" text-anchor="middle">
    <!-- 86.3 -->
    <rect x="92" y="446" width="60" height="110" fill="#4FA97A"/>
    <text x="122" y="438" fill="#F2F0E4">86.3</text>
    <!-- 65.7 -->
    <rect x="182" y="472" width="60" height="84" fill="#79B05C"/>
    <text x="212" y="464" fill="#F2F0E4">65.7</text>
    <!-- 26.0 -->
    <rect x="272" y="523" width="60" height="33" fill="#C9B34E"/>
    <text x="302" y="515" fill="#F2F0E4">26.0</text>
    <!-- 16.7 -->
    <rect x="362" y="535" width="60" height="21" fill="#E0953F"/>
    <text x="392" y="527" fill="#F2F0E4">16.7</text>
    <!-- 5.9 -->
    <rect x="452" y="548" width="60" height="8" fill="#F0625F"/>
    <text x="482" y="540" fill="#F2F0E4">5.9</text>
    <!-- 0.0 -->
    <rect x="542" y="553" width="60" height="3" fill="#F0625F"/>
    <text x="572" y="545" fill="#F0625F">0.0</text>
  </g>
  <g class="mono" font-size="14" fill="#8EA391" text-anchor="middle">
    <text x="122" y="576">0</text><text x="212" y="576">1</text><text x="302" y="576">2</text>
    <text x="392" y="576">3</text><text x="482" y="576">4</text><text x="572" y="576">5+</text>
  </g>

  <!-- figures -->
  <line x1="668" y1="404" x2="668" y2="576" stroke="#3A4A3E" stroke-width="1"/>
  <line x1="1012" y1="404" x2="1012" y2="576" stroke="#3A4A3E" stroke-width="1"/>

  <g>
    <text class="mono" x="700" y="466" font-size="46" font-weight="600" fill="#F2F0E4">0.823</text>
    <text class="serif" x="700" y="496" font-size="17" fill="#B9C7BA">ROC-AUC on held-out</text>
    <text class="serif" x="700" y="518" font-size="17" fill="#B9C7BA">applications</text>

    <text class="mono" x="1044" y="466" font-size="46" font-weight="600" fill="#F2F0E4">78%</text>
    <text class="serif" x="1044" y="496" font-size="17" fill="#B9C7BA">of declines caught at</text>
    <text class="serif" x="1044" y="518" font-size="17" fill="#B9C7BA">the tuned cutoff</text>
  </g>

  <!-- footer -->
  <line x1="92" y1="600" x2="1188" y2="600" stroke="#E9E7DA" stroke-width="2"/>
  <text class="mono" x="92" y="622" font-size="14" fill="#8EA391">Python / scikit-learn / XGBoost / Jupyter</text>
  <text class="mono" x="1188" y="622" font-size="14" fill="#8EA391" text-anchor="end">Seif Kungulio, M.S. Data Analytics</text>
</svg>
